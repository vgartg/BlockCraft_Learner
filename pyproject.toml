[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blockcraft-learner-game"
version = "1.0.0"
description = "Editable pygame sandbox that teaches Python through small modding tasks"
readme = "README.md"
license = { file = "LICENSE.txt" }
requires-python = ">=3.10"
authors = [{ name = "Valery Gorbanev" }]
keywords = ["pygame", "education", "sandbox", "blockcraft"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "pygame==2.5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5.0",
]

[project.scripts]
blockcraft = "blockcraft.__main__:main"

[tool.setuptools.packages.find]
include = ["blockcraft*", "mods*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["mods"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # line length handled by formatter
    "E722",   # bare except is intentional in places (defensive game loop)
    "B007",   # unused loop variable (game loops occasionally use _)
]

[tool.ruff.lint.per-file-ignores]
"mods/*.py" = ["E402", "F401"]
"tests/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
